[pytest]
testpaths = tests
# test modules are named after the module they cover, so collect every module
# under testpaths rather than pytest's default test_*.py / *_test.py
python_files = *.py
# The import root is the directory ABOVE this project, so `release/` can reach its
# vendored siblings by relative import -- the same shape a consumer installs into.
pythonpath = .. samples/backend
addopts = -ra
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
